name: BRK deployment contract
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brk-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing parser dependencies
        run: python -m pip install "PyYAML==6.0.3" "jsonschema==4.26.0"
      - name: Validate pinned runtime and memory contract
        run: python -m unittest discover -s tests -p test_brk_compose.py -v
