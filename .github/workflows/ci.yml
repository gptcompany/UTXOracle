# CI Pipeline using organization reusable workflows
# Runs security, lint, and test checks on push/PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_streams_health_contract:
        description: 'Run spec-061 live /v1/streams/health contract gate'
        required: false
        default: false
        type: boolean

jobs:
  security:
    name: Security Scan
    uses: gptcompany/claude-hooks-shared/.github/workflows/_reusable-security.yml@main
    with:
      bandit-paths: '.'
      fail-on-high-severity: true

  lint:
    name: Lint & Types
    uses: gptcompany/claude-hooks-shared/.github/workflows/_reusable-lint.yml@main
    with:
      python-version: '3.12'
      mypy-paths: '.'
      fail-on-type-errors: false

  test:
    name: Tests
    needs: [security, lint]
    uses: gptcompany/claude-hooks-shared/.github/workflows/_reusable-tests.yml@main
    with:
      python-version: '3.12'
      test-paths: 'tests/'
      coverage-paths: '.'
      # Floor = measured baseline (68.4% on 2026-10-22, python 3.11, tests/e2e excluded).
      # It only goes up: raise it when the baseline rises, never lower it.
      coverage-threshold: 68
      # tests/e2e drive a browser against a running dashboard on :8001: they need
      # playwright's chromium and a live stack, neither exists on the hosted runner.
      # Run them by hand (tests/e2e/README.md).
      pytest-args: '--ignore=tests/e2e'

  streams-health-contract:
    name: Streams Health Contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_streams_health_contract }}
    needs: [security, lint]
    runs-on: [self-hosted, Linux, X64, dell-runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run stream health integration gate
        env:
          RUN_STREAMS_HEALTH_CONTRACT: "1"
        run: |
          uv run pytest tests/integration/test_streams_health_contract.py \
            -m integration -q
