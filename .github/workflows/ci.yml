# TODO: return to reviewed shared workflows once their runner boundary is fixed.
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gbg-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --all-extras
      - name: Regression tests
        run: uv run pytest tests/test_live_storage.py tests/test_live_worker.py tests/test_workflow_runners.py -q
      - name: Full suite and existing coverage floor
        if: always() && !cancelled()
        run: uv run pytest tests/ --ignore=tests/e2e --cov=. --cov-fail-under=68 --tb=short
      - name: Ruff
        if: always() && !cancelled()
        run: uv run ruff check .
