name: Notify PePeRS Integration

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.repository_owner == 'gptcompany'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Metadata
        id: meta
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Fail closed: a missing token used to skip the dispatch silently.
      - name: Require the progressive-deploy dispatch token
        env:
          PD_TOKEN: ${{ secrets.PROGRESSIVE_DEPLOY_REPO_DISPATCH_TOKEN || secrets.PAT }}
        run: |
          if [[ -z "$PD_TOKEN" ]]; then
            echo "::error title=Dispatch token missing::Set the PROGRESSIVE_DEPLOY_REPO_DISPATCH_TOKEN (or PAT) repository secret: without it progressive-deploy is never notified."
            exit 1
          fi

      - name: Repository dispatch to progressive-deploy
        id: progressive_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PROGRESSIVE_DEPLOY_REPO_DISPATCH_TOKEN || secrets.PAT }}
          repository: gptcompany/progressive-deploy
          event-type: utxoracle-build
          client-payload: >-
            {"source_repo":"${{ github.repository }}","source_ref":"${{ github.ref_name }}","source_sha":"${{ github.sha }}","source_workflow":"${{ github.workflow }}","ref":"${{ github.sha }}","version":"${{ steps.meta.outputs.version }}","commit_sha":"${{ steps.meta.outputs.sha }}","build_at":"${{ steps.meta.outputs.build_at }}"}
