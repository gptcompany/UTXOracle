name: Streams Consumption Contract

# spec-061 T038: the CI gate for closing Issue #8.
#
# Runs `pytest -m integration tests/integration/test_streams_health_contract.py`
# against a live QuestDB service container. The test asserts:
#   - GET /v1/streams/health returns 13 stream readings,
#   - each conforms to the OpenAPI schema,
#   - the rollup `overall == "OK"`.
#
# Until the operational backfill (T036) completes against the real QuestDB
# instance, this workflow is expected to FAIL (or report `overall: DEGRADED`).
# Once green it stays green on every PR — a drift back to DEGRADED is a
# contract regression and blocks merge per spec FR-012.

"on":
  push:
    branches: [main, '061-stream-consumption-contract']
    paths:
      - 'api/routes/streams.py'
      - 'api/models/streams.py'
      - 'api/questdb_repository.py'
      - 'docs/contracts/stream_registry.yaml'
      - 'docs/SCHEMA_VERSIONING.md'
      - 'docs/NAUTILUS_DEV_ADOPTION.md'
      - 'specs/061-stream-consumption-contract/**'
      - 'tests/integration/test_streams_health_contract.py'
      - 'tests/test_stream*'
      - 'tests/test_streams*'
      - '.github/workflows/streams-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/routes/streams.py'
      - 'api/models/streams.py'
      - 'api/questdb_repository.py'
      - 'docs/contracts/stream_registry.yaml'
      - 'docs/SCHEMA_VERSIONING.md'
      - 'docs/NAUTILUS_DEV_ADOPTION.md'
      - 'specs/061-stream-consumption-contract/**'
      - 'tests/integration/test_streams_health_contract.py'
      - 'tests/test_stream*'
      - 'tests/test_streams*'
      - '.github/workflows/streams-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    name: GET /v1/streams/health acceptance gate
    runs-on: ubuntu-latest

    services:
      questdb:
        image: questdb/questdb:7.4.0
        ports:
          - 8812:8812
          - 9000:9000
          - 9009:9009
        # No service-level --health-cmd: the QuestDB 7.4.0 image ships
        # without `wget`, so the previous probe never reported healthy and
        # Docker timed out the container on every CI run. The job's
        # "Wait for QuestDB to be ready" step below performs the same
        # SELECT 1 probe from the runner side and is the authoritative
        # readiness gate (30 × 2s = 60 s window before the job fails).

    env:
      QUESTDB_PG_HOST: localhost
      QUESTDB_PG_PORT: 8812
      QUESTDB_PG_USER: admin
      QUESTDB_PG_PASSWORD: quest
      QUESTDB_PG_DATABASE: qdb
      # Honour the explicit opt-in guard in the test fixture.
      RUN_STREAMS_HEALTH_CONTRACT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for QuestDB to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:9000/exec?query=SELECT%201" > /dev/null; then
              echo "QuestDB ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "QuestDB never became ready"
          exit 1

      - name: Run unit-level registry + endpoint tests (always green)
        run: |
          uv run pytest \
            tests/test_stream_registry.py \
            tests/test_streams_health.py \
            tests/test_streams_health_perf.py \
            tests/test_calculate_daily_metrics_questdb.py \
            tests/test_calculate_daily_metrics_idempotent.py \
            tests/test_mirror_backtest_whale_signals.py \
            tests/test_historical_spent_backfill_target_backend.py \
            tests/test_verify_utxo_lifecycle_mirror.py \
            tests/test_mirror_utxo_lifecycle_to_questdb.py \
            tests/test_catchup_utxo_lifecycle_to_tip.py \
            -v --tb=short

      - name: DDL coverage against live QuestDB
        run: uv run pytest tests/test_create_tables_ddl.py -v --tb=short

  # F-400: the acceptance assertion (overall == "OK" for the 13 streams) needs real data
  # (operational backfill T036 and at least one daily aggregator run). A fresh CI QuestDB has
  # none, so it reports DEGRADED / 13 MISSING by construction. It lives in its own job so that
  # the contract job above (registry, endpoint, DDL coverage) is judged on what CI can prove.
  # The assertion is unchanged: non-blocking on pull requests, a hard failure on main (FR-012).
  streams-acceptance-T036:
    name: Streams acceptance gate (T036 data required)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}

    services:
      questdb:
        image: questdb/questdb:7.4.0
        ports:
          - 8812:8812
          - 9000:9000
          - 9009:9009

    env:
      QUESTDB_PG_HOST: localhost
      QUESTDB_PG_PORT: 8812
      QUESTDB_PG_USER: admin
      QUESTDB_PG_PASSWORD: quest
      QUESTDB_PG_DATABASE: qdb
      RUN_STREAMS_HEALTH_CONTRACT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for QuestDB to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:9000/exec?query=SELECT%201" > /dev/null; then
              echo "QuestDB ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "QuestDB never became ready"
          exit 1

      # The tables the registry reads must exist, as they did when the DDL test ran first in
      # the same job; only the data is missing.
      - name: Create the tables (production DDL)
        run: |
          uv run python -c "import asyncio; from api.questdb_repository import create_tables_if_not_exist; asyncio.run(create_tables_if_not_exist())"

      - name: Acceptance gate (T010 — overall == OK)
        run: |
          uv run pytest tests/integration/test_streams_health_contract.py \
            -v -m integration --tb=short
