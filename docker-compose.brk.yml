# Existing Dell runtime; provenance and apply procedure: docs/BRK_DEPLOYMENT.md
name: brk
services:
  brk:
    image: brk@sha256:ca2e444a0598a5c0847642add4bd3f111ff3cc805b8d51aba10c0cfc2317c6c3
    pull_policy: never
    container_name: brk
    network_mode: host
    restart: unless-stopped
    # Match brk-stack.service TimeoutStopSec so recreation can flush the index.
    stop_grace_period: 300s
    mem_limit: 15g
    memswap_limit: 15g
    volumes:
      - ${BITCOIN_DATA_DIR:-/data/cold/12TB/Bitcoin}:/bitcoin:ro
      - ${BRK_DATA_DIR:-/data/4TB/brk-v0.3.6-data}:/home/brk/.brk
    command:
      - --bitcoindir
      - /bitcoin
      - --blocksdir
      - /bitcoin/blocks
      - --brkdir
      - /home/brk/.brk
      - --brkport
      - "7070"
      - --rpcconnect
      - 127.0.0.1
      - --rpcuser
      - ${BTC_RPC_USER:?external env required}
      - --rpcpassword
      - ${BTC_RPC_PASSWORD:?external env required}
