services:
  utxoracle-live-questdb:
    image: questdb/questdb:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9912:8812"
      - "127.0.0.1:9900:9000"
      - "127.0.0.1:9909:9009"
    volumes:
      - ./data/questdb-live:/var/lib/questdb

  utxoracle-live-worker:
    image: utxoracle-live:local
    user: "1000:1000"
    command: ["/app/.venv/bin/python", "-m", "scripts.live.runtime"]
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    init: true
    depends_on:
      - utxoracle-live-questdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LIVE_ENABLED: "true"
      LIVE_WORKER_LOCK_PATH: /app/data/utxoracle_live.questdb.worker.lock
      LIVE_RETENTION_HOURS: ${LIVE_RETENTION_HOURS:-24}
      LIVE_SOURCE_TIMEOUT_SECONDS: ${LIVE_SOURCE_TIMEOUT_SECONDS:-5.0}
      LIVE_MARKET_INTERVAL_SECONDS: ${LIVE_MARKET_INTERVAL_SECONDS:-5.0}
      LIVE_BLOCK_POLL_INTERVAL_SECONDS: ${LIVE_BLOCK_POLL_INTERVAL_SECONDS:-2.0}
      LIVE_ORACLE_TX_CONCURRENCY: ${LIVE_ORACLE_TX_CONCURRENCY:-32}
      LIVE_ORACLE_MIN_TX_COUNT: ${LIVE_ORACLE_MIN_TX_COUNT:-1000}
      DUCKDB_PATH: /app/data/utxoracle.duckdb
      UTXORACLE_DB_PATH: /app/data/utxoracle.duckdb
      ELECTRS_HTTP_URL: ${ELECTRS_HTTP_URL:-http://host.docker.internal:3002}
      MEMPOOL_API_URL: ${MEMPOOL_API_URL:-http://host.docker.internal:8999}
      MEMPOOL_API_V1_URL: ${MEMPOOL_API_V1_URL:-http://host.docker.internal:8999/api/v1}
      BRK_BASE_URL: ${BRK_BASE_URL:-http://host.docker.internal:7071}
      HYPERLIQUID_NODE_API_URL: ${HYPERLIQUID_NODE_API_URL:-http://host.docker.internal:3001/info}
      HYPERLIQUID_NODE_INFO_REQUEST_TYPE: ${HYPERLIQUID_NODE_INFO_REQUEST_TYPE:-l4Book}
      HYPERLIQUID_NODE_SNAPSHOT_PATH: ${HYPERLIQUID_NODE_SNAPSHOT_PATH:-}
      HYPERLIQUID_METRICS_URL: ${HYPERLIQUID_METRICS_URL:-http://host.docker.internal:9101/metrics}
      HYPERLIQUID_DATA_ROOT: /app/external/hyperliquid/node-data
      HYPERLIQUID_FILTERED_STREAM: ${HYPERLIQUID_FILTERED_STREAM:-hip3_oracle_updates_by_block}
      HYPERLIQUID_MAX_AGE_SECONDS: ${HYPERLIQUID_MAX_AGE_SECONDS:-900}
      QUESTDB_PG_HOST: utxoracle-live-questdb
      QUESTDB_ILP_HOST: utxoracle-live-questdb
      QUESTDB_HTTP_HOST: utxoracle-live-questdb
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /media/sam/4TB-NVMe/docker-volumes/hyperliquid/hl/data:/app/external/hyperliquid/node-data:ro

  utxoracle-data-updater:
    image: utxoracle-live:local
    user: "1000:1000"
    restart: always
    volumes:
      - ./data:/app/data
    command: >
      /bin/sh -c "while true; do
        /app/.venv/bin/python3 scripts/bootstrap/scrape_exchange_addresses.py &&
        /app/.venv/bin/python3 scripts/bootstrap/ingest_to_db.py &&
        echo 'Registry updated, signaling monitor...';
        sleep 604800;
      done"
    depends_on:
      - utxoracle-live-questdb
    environment:
      DUCKDB_PATH: /app/data/utxoracle.duckdb
      UTXORACLE_DB_PATH: /app/data/utxoracle.duckdb
      QUESTDB_PG_HOST: utxoracle-live-questdb
      QUESTDB_ILP_HOST: utxoracle-live-questdb
      QUESTDB_HTTP_HOST: utxoracle-live-questdb

  utxoracle-live-api:
    image: utxoracle-live:local
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile.live
      args:
        VERSION: ${UTXORACLE_VERSION:-unknown}
        COMMIT_SHA: ${UTXORACLE_COMMIT_SHA:-unknown}
        BUILD_AT: ${UTXORACLE_BUILD_AT:-unknown}
    command:
      - /app/.venv/bin/uvicorn
      - api.apps.live:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --workers
      - "1"
      - --log-level
      - info
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    init: true
    depends_on:
      - utxoracle-live-questdb
      - utxoracle-live-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LIVE_API_PORT:-8011}:8011"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-jBqveFvsr4ifuLX3Gf6CIyJCujuLSYiIUD437Hntf60HbRSlWmF7U0HXnVnvulSn}
      FASTAPI_PORT: "8011"
      LIVE_API_PORT: "8011"
      LIVE_ENABLED: "true"
      DUCKDB_PATH: /app/data/utxoracle.duckdb
      UTXORACLE_DB_PATH: /app/data/utxoracle.duckdb
      LIVE_RETENTION_HOURS: ${LIVE_RETENTION_HOURS:-24}
      ELECTRS_HTTP_URL: ${ELECTRS_HTTP_URL:-http://host.docker.internal:3002}
      MEMPOOL_API_URL: ${MEMPOOL_API_URL:-http://host.docker.internal:8999}
      MEMPOOL_API_V1_URL: ${MEMPOOL_API_V1_URL:-http://host.docker.internal:8999/api/v1}
      BRK_BASE_URL: ${BRK_BASE_URL:-http://host.docker.internal:7071}
      HYPERLIQUID_NODE_API_URL: ${HYPERLIQUID_NODE_API_URL:-http://host.docker.internal:3001/info}
      HYPERLIQUID_NODE_INFO_REQUEST_TYPE: ${HYPERLIQUID_NODE_INFO_REQUEST_TYPE:-l4Book}
      HYPERLIQUID_NODE_SNAPSHOT_PATH: ${HYPERLIQUID_NODE_SNAPSHOT_PATH:-}
      HYPERLIQUID_METRICS_URL: ${HYPERLIQUID_METRICS_URL:-http://host.docker.internal:9101/metrics}
      HYPERLIQUID_DATA_ROOT: /app/external/hyperliquid/node-data
      HYPERLIQUID_FILTERED_STREAM: ${HYPERLIQUID_FILTERED_STREAM:-hip3_oracle_updates_by_block}
      HYPERLIQUID_MAX_AGE_SECONDS: ${HYPERLIQUID_MAX_AGE_SECONDS:-900}
      QUESTDB_PG_HOST: utxoracle-live-questdb
      QUESTDB_ILP_HOST: utxoracle-live-questdb
      QUESTDB_HTTP_HOST: utxoracle-live-questdb
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /media/sam/4TB-NVMe/docker-volumes/hyperliquid/hl/data:/app/external/hyperliquid/node-data:ro

  utxoracle-data-updater:
    image: utxoracle-live:local
    user: "1000:1000"
    restart: always
    volumes:
      - ./data:/app/data
    command: >
      /bin/sh -c "while true; do
        /app/.venv/bin/python3 scripts/bootstrap/scrape_exchange_addresses.py &&
        /app/.venv/bin/python3 scripts/bootstrap/ingest_to_db.py &&
        echo 'Registry updated, signaling monitor...';
        sleep 604800;
      done"
    depends_on:
      - utxoracle-live-questdb
    environment:
      DUCKDB_PATH: /app/data/utxoracle.duckdb
      UTXORACLE_DB_PATH: /app/data/utxoracle.duckdb
      QUESTDB_PG_HOST: utxoracle-live-questdb
      QUESTDB_ILP_HOST: utxoracle-live-questdb
      QUESTDB_HTTP_HOST: utxoracle-live-questdb
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
