  - "docs/FEATURE_SERVICE_ROADMAP_2026-04-01.md"
decision_vocab:
  local_canonical: "UTXOracle owns the metric semantics and downstream contract."
  adopt_from_brk: "BRK is the preferred production source; UTXOracle should consume or normalize it rather than re-implement it by default."
  local_research_only: "Local implementation is allowed for research, validation, or custom variants, but is not the default production source."
  hold_pending_explicit_source_decision: "No promotion beyond research should happen until a written BRK-vs-local decision exists."
scope_note:
  - "Initial metric-level manifest focused on current duplication-risk and roadmap metrics."
entries:
  - metric_id: "utxoracle_price"
    preferred_production_source: "UTXOracle"
    current_integration: "UTXOracle live worker and live snapshot surface"
    policy: "local_canonical"
    current_runtime_status: "Admitted live metric on :8011"
    local_role: "Canonical downstream on-chain oracle signal"
    immediate_rule: "Never replace with BRK or another external metric feed."
  - metric_id: "realized_price_usd"
    preferred_production_source: "BRK"
    current_integration: "Consumed through BrkClient curated live subset and live chart comparisons"
    policy: "adopt_from_brk"
    current_runtime_status: "Live-plane upstream feature only"
    local_role: "Comparison and validation only unless a separate consumer contract is explicitly added"
    immediate_rule: "Do not open a new local productization track for this metric by default."
  - metric_id: "liveliness"
    preferred_production_source: "BRK"
    current_integration: "Consumed through BrkClient curated live subset"
    policy: "adopt_from_brk"
    current_runtime_status: "Live-plane upstream feature; repo-local cointime analytics still exist separately"
    local_role: "Local cointime logic remains valid for research, validation, and custom variants"
    immediate_rule: "Do not create a second admitted consumer route for the shared signal without an explicit contract reason."
  - metric_id: "reserve_risk"
    preferred_production_source: "BRK"
    current_integration: "Consumed through BrkClient curated live subset; local main-app route remains excluded"
    policy: "adopt_from_brk"
    current_runtime_status: "Shared live feature comes from BRK; /api/metrics/reserve-risk remains non-productized"
    local_role: "Validation and experimental only until an explicit independent local variant is approved"
    immediate_rule: "Discard local route-productization work by default; reopen only if BRK adoption is blocked or a different local methodology is explicitly approved."
  - metric_id: "nupl"
    preferred_production_source: "Undecided; BRK preferred for any future shared admitted signal while UTXOracle DuckDB remains useful for research"
    current_integration: "Local DuckDB-backed research route at /api/metrics/nupl"
    policy: "hold_pending_explicit_source_decision"
    current_runtime_status: "tier_3_research"
    local_role: "Research, validation, and custom experimentation"
    immediate_rule: "Do not promote beyond tier_3 by default; future admission must choose BRK adoption or an explicit reduced local contract."
  - metric_id: "cost_basis"
    preferred_production_source: "UTXOracle DuckDB"
    current_integration: "Local DuckDB-backed research route at /api/metrics/cost-basis"
    policy: "local_canonical"
    current_runtime_status: "tier_3_research"
    local_role: "Repo-native cohort and cost-basis analytics"
    immediate_rule: "Keep local ownership unless an exact upstream equivalent is named, verified, and contractually frozen."
