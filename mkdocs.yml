# MkDocs Template v1.0
# Maintained at: ~/.claude/templates/mkdocs.yml
# Deploy: sed 's/UTXOracle/<name>/g' ~/.claude/templates/mkdocs.yml > <repo>/mkdocs.yml
# Build: mkdocs build --strict
# Serve: mkdocs serve

site_name: UTXOracle Documentation
site_description: Technical documentation for UTXOracle
repo_url: https://github.com/gptcompany/UTXOracle

nav:
  - Architecture: ARCHITECTURE.md
  - API Reference: WHALE_API_DOCUMENTATION.md
  - Operations: OPERATIONS.md
  - Runbooks:
      - Streams contract: RUNBOOK_SPEC061.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - techdocs-core

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
